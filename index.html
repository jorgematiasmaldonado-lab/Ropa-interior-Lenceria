<!doctype html>
<!--
  Ropa Interior & Lencería – Abigail Maldonado
  App de gestión (ventas, mercadería, gastos y control)
  Desarrollo: JMM Gestiones & Tecnología – © 2026 Maldonado Jorge Matias
-->
<html lang="es-AR" data-tema="oscuro">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

  <!-- Seguridad: política de contenido. Solo se cargan archivos propios de la app.
       La conexión a dolarapi.com se usará (opcional) para sugerir la cotización del dólar. -->
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' https://dolarapi.com; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'">
  <meta name="referrer" content="no-referrer">

  <title>Ropa Interior & Lencería</title>
  <meta name="description" content="Gestión de ventas, mercadería y gastos – Ropa Interior & Lencería">
  <meta name="theme-color" content="#1E1718">

  <!-- PWA -->
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="img/iconos/favicon-32.png">
  <!-- iPhone / iPad -->
  <link rel="apple-touch-icon" href="img/iconos/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Lencería">

  <link rel="stylesheet" href="css/app.css">
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <!-- Encabezado -->
  <header class="encabezado">
    <div class="encabezado__izq">
      <img class="encabezado__logo oculto" id="logo-negocio" alt="" width="40" height="40">
      <div class="encabezado__marca">
        <span class="encabezado__titulo" id="nombre-negocio">Ropa Interior &amp; Lencería</span>
        <span class="encabezado__sub" id="nombre-duena">Abigail Maldonado</span>
      </div>
    </div>
    <span class="estado-red" id="estado-red" role="status" aria-live="polite">En línea</span>
  </header>

  <!-- Aviso de nueva versión -->
  <div class="aviso-version oculto" id="aviso-version" role="alert">
    <span>Hay una nueva versión de la app.</span>
    <button type="button" class="boton boton--chico" id="boton-actualizar">Actualizar</button>
  </div>

  <!-- Contenido de cada pantalla -->
  <main class="contenido" id="contenido" tabindex="-1">
    <p class="cargando">Cargando…</p>
  </main>

  <!-- Pie de página -->
  <footer class="pie">
    <img src="img/logo-jmm.png" alt="JMM Gestiones & Tecnología" class="pie__logo" width="36" height="36">
    <p class="pie__texto">JMM Gestiones &amp; Tecnología<br>© 2026 Maldonado Jorge Matias – Todos los derechos reservados</p>
  </footer>

  <!-- Navegación inferior -->
  <nav class="nav" aria-label="Navegación principal">
    <a href="#/inicio" class="nav__item" data-ruta="inicio">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11.5 12 4l9 7.5M5.5 9.5V20h13V9.5"/></svg>
      <span>Inicio</span>
    </a>
    <a href="#/ventas" class="nav__item" data-ruta="ventas">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 7h12l-1 13H7L6 7Zm3 0a3 3 0 0 1 6 0"/></svg>
      <span>Ventas</span>
    </a>
    <a href="#/inventario" class="nav__item" data-ruta="inventario">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7.5 12 4l8 3.5v9L12 20l-8-3.5v-9ZM4 7.5l8 3.5 8-3.5M12 11v9"/></svg>
      <span>Inventario</span>
    </a>
    <a href="#/gastos" class="nav__item" data-ruta="gastos">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16v12H4zM4 10h16M8 15h3"/></svg>
      <span>Gastos</span>
    </a>
    <a href="#/mas" class="nav__item" data-ruta="mas">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h.01M12 12h.01M19 12h.01"/></svg>
      <span>Más</span>
    </a>
  </nav>

  <noscript><p class="cargando">Esta app necesita JavaScript activado.</p></noscript>
</body>
</html>
